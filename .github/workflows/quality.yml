name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint PHP
        run: find . -type f -name '*.php' -not -path './build/*' -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript syntax
        run: find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

